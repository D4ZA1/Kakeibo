plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.upiintent'
version = '1.0.0'

android {
  namespace "expo.modules.upiintent"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // QR encoding for shareQrImage (apps that only accept personal payments from a scanned QR).
  implementation 'com.google.zxing:core:3.5.1'
}

